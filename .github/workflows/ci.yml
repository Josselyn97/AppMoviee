name: CI Proyecto Full Stack Movie

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  validar-backend:
    name: Validar Backend
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Versión de Node compatible con tu proyecto
          cache: 'npm'

      - name: Instalar dependencias Backend
        run: npm ci

      - name: Verificar calidad Backend
        run: npm run lint --if-present

      - name: Ejecutar pruebas Backend
        run: npm test

      - name: Construir Backend
        run: npm run build --if-present

  validar-docker:
    name: Validar Docker
    runs-on: ubuntu-latest
    needs: validar-backend # Asegura que Docker solo valide si el backend pasa con éxito

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Validar Docker Compose
        # Comprueba que la sintaxis de tu docker-compose.yml esté perfecta
        run: docker compose config

      - name: Construir imágenes Docker
        # Compila tu Dockerfile aplicando el .dockerignore que creamos
        run: docker compose build
